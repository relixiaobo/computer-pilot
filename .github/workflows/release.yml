name: Publish Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    environment: release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' && secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD != '' && secrets.RELEASE_KEYCHAIN_PASSWORD != '' && secrets.DEVELOPER_ID_APPLICATION != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Verify tag and versions
        run: |
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Refusing to publish: $TAG does not point to a commit on origin/main." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          bash scripts/check-version-sync.sh "$VERSION"
      - name: Build Apple Silicon binary
        run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Import Developer ID certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/computer-pilot-signing.keychain-db"
          echo "$CERTIFICATE_P12" | base64 -D >"$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: Sign fixed Computer Pilot identity
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          BINARY="target/aarch64-apple-darwin/release/cu"
          codesign --force --timestamp --options runtime --identifier com.linlab.computer-pilot.cu --sign "$SIGNING_IDENTITY" "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"
          codesign -dvv "$BINARY"
      - name: Notarize signed binary
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent target/aarch64-apple-darwin/release/cu "$RUNNER_TEMP/cu-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/cu-notary.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          echo "COMPUTER_PILOT_SIGNING_STATUS=developer-id-notarized" >> "$GITHUB_ENV"
      - name: Apply fixed ad-hoc identity when Developer ID is unavailable
        if: env.HAS_DEVELOPER_ID != 'true'
        run: |
          BINARY="target/aarch64-apple-darwin/release/cu"
          codesign --force --identifier com.linlab.computer-pilot.cu --sign - "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"
          echo "COMPUTER_PILOT_SIGNING_STATUS=ad-hoc-unsigned" >> "$GITHUB_ENV"
      - name: Build release assets
        run: |
          VERSION="${TAG#v}"
          mkdir -p "$RUNNER_TEMP/computer-pilot-dist"
          bash scripts/build-release-assets.sh "$VERSION" "$PWD/target/aarch64-apple-darwin/release/cu" "$RUNNER_TEMP/computer-pilot-dist"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$COMPUTER_PILOT_SIGNING_STATUS" == "developer-id-notarized" ]]; then
            NOTICE="Developer ID signed and Apple-notarized macOS artifact."
          else
            NOTICE="Unsigned development release (ad-hoc identity): SHA-256 verified, but not Apple-notarized. macOS TCC permissions may need to be granted again after upgrades."
          fi
          gh release create "$TAG" "$RUNNER_TEMP/computer-pilot-dist"/* --verify-tag --generate-notes --notes "$NOTICE" --title "Computer Pilot $TAG"
