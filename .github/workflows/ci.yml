name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only checks that a GitHub-hosted runner can honestly complete live here.
# The TCC-enabled command suite needs a real desktop session holding
# Accessibility and Screen Recording grants, so it runs from
# tcc-suite.yml on demand and locally through scripts/verify.sh.
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check release versions
        run: bash scripts/check-version-sync.sh
      - name: Validate skill metadata
        run: |
          head -1 plugin/skills/computer-pilot/SKILL.md | grep -qx -- '---'
          grep -qx 'name: computer-pilot' plugin/skills/computer-pilot/SKILL.md
          python3 -m json.tool plugin/skills/computer-pilot/compatibility.json >/dev/null
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
